artifact_dir: forecast/artifacts
checkpoint_name: model.pt

model:
  quantiles: [0.1, 0.5, 0.9]
  embedding_dim: 8
  hidden_sizes: [64, 32]
  dropout: 0.1

train:
  days: 730
  products: 60
  epochs: 40
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.00001
  validation_fraction: 0.2
  seed: 42
  min_history_days: 28

mlflow:
  enabled: true
  tracking_uri: null
  registry_uri: null
  experiment: inventory-demand
  model_name: demand_forecaster
  alias: champion
  challenger_alias: challenger

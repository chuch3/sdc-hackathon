[project]
name = "freshstock-backend"
version = "0.1.0"
description = "FreshStock perishable food inventory API"
requires-python = ">=3.11.12"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "numpy>=1.26,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0,<2.1",
    "tzdata>=2024.1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

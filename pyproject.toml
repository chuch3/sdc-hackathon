[project]
name = "sdc-hackathon"
version = "0.1.0"
description = "FreshStock: perishable food inventory, FEFO, forecasting, and SDG estimates for small shops"
readme = "README.md"
requires-python = ">=3.11.12"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.150.0",
    "flask>=3.1.3",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pydantic-settings>=2.16.1",
    "requests>=2.34.2",
    "sqlalchemy>=2.0,<2.1",
    "streamlit>=1.40",
    "tzdata>=2024.1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.15.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
ml = [
    "mlflow>=3.17.1",
    "pyyaml>=6.0.3",
    "torch>=2.14.1",
]

[tool.pytest.ini_options]
testpaths = ["forecast/tests"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"dashboard/app.py" = ["E402"]
